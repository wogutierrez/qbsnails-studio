backend:
  name: github
  repo: qbsnails/qbsnails-studio
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "services"
    label: "Studio Services"
    folder: "src/content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Service Name", name: "name", widget: "string" }
      - { label: "Price", name: "price", widget: "string" }
      - {
          label: "Duration",
          name: "duration",
          widget: "string",
          required: false
        }
      - { label: "Badge", name: "badge", widget: "string", required: false }
      - {
          label: "Category",
          name: "category",
          widget: "select",
          options:
            ["Hands", "Feet", "Art", "Spa Care", "Extensions", "Packages"]
        }
      - {
          label: "Description",
          name: "description",
          widget: "text",
          required: false
        }
