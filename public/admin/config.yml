backend:
  name: github
  repo: wogutierrez/qbsnails-studio
  branch: main
  base_url: https://sveltia-cms-auth.wogutierrez.workers.dev

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "services"
    label: "Studio Services"
    folder: "src/content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Service Name", name: "name", widget: "string" }
      # -----------------------------------------------------------------------
      # ADDED LINE: Featured Service Boolean Toggle Switch
      # - widget: "boolean" renders a clean Yes/No checkmark inside Sveltia CMS.
      # - name: "featured" creates a true/false property in the markdown frontmatter.
      # - default: false ensures new services aren't automatically featured.
      # - required: false prevents build errors on existing services missing this field.
      # -----------------------------------------------------------------------
      - {
          label: "Featured on Homepage?",
          name: "featured",
          widget: "boolean",
          default: false,
          required: false,
        }

      - { label: "Price", name: "price", widget: "string" }
      - {
          label: "Duration",
          name: "duration",
          widget: "string",
          required: false,
        }
      - { label: "Badge", name: "badge", widget: "string", required: false }
      - {
          label: "Category",
          name: "category",
          widget: "select",
          options:
            ["Hands", "Feet", "Art", "Spa Care", "Extensions", "Packages"],
        }
      - {
          label: "Description",
          name: "description",
          widget: "text",
          required: false,
        }
      - {
          label: "Service Image",
          name: "image",
          widget: "image",
          required: true,
          media_library: { config: { multiple: false } },
        }

  - name: "reviews"
    label: "Client Reviews"
    folder: "src/content/reviews"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Client Name", name: "name", widget: "string" }
      - {
          label: "Suburb / Location",
          name: "suburb",
          widget: "string",
          required: false,
        }
      - { label: "Review Text", name: "text", widget: "text" }
      - {
          label: "Rating (1-5)",
          name: "rating",
          widget: "number",
          value_type: "int",
          default: 5,
          min: 1,
          max: 5,
          required: false,
        }
